<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIJAGAME Battle Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,"Noto Sans TC",sans-serif;color:#3a2816}#game{height:100%;display:flex;flex-direction:column;background:linear-gradient(#b8d9e7 0 55%,#759852 55%)}.top{height:72px;background:linear-gradient(#f9e9bc,#c99c55);border-bottom:4px solid #6f4b20;display:flex;align-items:center;justify-content:center;position:relative}.title{font-size:25px;font-weight:900;text-shadow:0 1px #fff}.turn{position:absolute;right:20px;background:#5a4025;color:#fff4ce;border-radius:18px;padding:7px 15px}.battlefield{flex:1;position:relative;overflow:hidden;background:linear-gradient(#a9d7ea 0 58%,transparent 58%),linear-gradient(90deg,#758f4a,#a7b65f 50%,#708844);min-height:420px}.mountains{position:absolute;left:0;right:0;bottom:39%;height:48%;opacity:.35;background:linear-gradient(135deg,transparent 20%,#536d70 21% 35%,transparent 36%) 0 0/260px 160px}.ground{position:absolute;bottom:0;width:100%;height:42%;background:linear-gradient(#8ca34f,#60783a);border-top:6px solid #a8bd70}.stone{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:72%;height:70px;background:#a9a07e;border:5px solid #756d52;border-radius:50%;box-shadow:0 15px 0 #59683c}.hud{position:absolute;top:18px;width:42%;z-index:4}.hud.left{left:3%}.hud.right{right:3%;text-align:right}.portrait{display:inline-grid;place-items:center;width:62px;height:62px;border:4px solid #795426;border-radius:10px;background:#f3d58c;font-size:38px;vertical-align:middle}.info{display:inline-block;width:calc(100% - 75px);vertical-align:middle}.name{font-weight:900;font-size:17px}.bar{height:17px;background:#49392d;border:3px solid #f2d79b;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px #0008}.hp{height:100%;background:linear-gradient(#e55742,#b62624);transition:.35s}.chakra{height:8px;background:#238bd2;border:2px solid #e6d7b4;border-radius:5px;margin-top:3px}.fighter{position:absolute;bottom:26%;width:125px;height:155px;z-index:3;transition:transform .22s cubic-bezier(.2,.8,.3,1);transform-origin:50% 100%}.fighter.player{left:20%}.fighter.enemy{right:20%;transform:scaleX(-1)}.head{position:absolute;left:29px;top:5px;width:68px;height:65px;border-radius:48% 48% 45% 45%;background:#f2c99e;border:3px solid #3a2b27;z-index:3}.hair{position:absolute;left:15px;top:-17px;width:96px;height:68px;background:#e9edf8;clip-path:polygon(0 55%,18% 27%,24% 47%,38% 5%,45% 41%,64% 0,64% 42%,89% 18%,77% 56%,100% 50%,76% 82%,20% 81%);z-index:4}.enemy .hair{background:#c72c2c}.eye{position:absolute;top:31px;width:8px;height:10px;background:#153e67;border-radius:50%;z-index:5}.eye.a{left:44px}.eye.b{left:71px}.body{position:absolute;left:34px;top:65px;width:58px;height:65px;border-radius:18px 18px 8px 8px;background:#243d61;border:3px solid #2d2926}.enemy .body{background:#641f26}.arm{position:absolute;top:78px;width:55px;height:17px;background:#f2c99e;border:3px solid #352b27;border-radius:12px}.arm.r{left:70px;transform:rotate(-16deg)}.arm.l{left:4px;transform:rotate(18deg)}.leg{position:absolute;top:120px;width:20px;height:35px;background:#222;border-radius:5px}.leg.a{left:36px;transform:rotate(10deg)}.leg.b{left:68px;transform:rotate(-10deg)}.weapon{position:absolute;left:95px;top:72px;width:68px;height:7px;background:#dce7ef;border:2px solid #333;transform:rotate(-25deg);transform-origin:left}.shadow{position:absolute;left:15px;bottom:0;width:100px;height:17px;background:#0003;border-radius:50%}.idle{animation:bob 1.25s infinite ease-in-out}@keyframes bob{50%{margin-bottom:5px}}.attackP{transform:translateX(350px) rotate(-4deg)!important}.attackE{transform:scaleX(-1) translateX(350px) rotate(-4deg)!important}.hurt{animation:hurt .25s 2}@keyframes hurt{50%{filter:brightness(2) sepia(1);margin-left:14px}}.fx{position:absolute;z-index:7;pointer-events:none;font-weight:900}.slash{width:150px;height:150px;border:15px solid #62bfff;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;filter:drop-shadow(0 0 12px #30a5ff);animation:slash .35s forwards}@keyframes slash{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:scale(1.4) rotate(45deg);opacity:0}}.damage{font-size:35px;color:#d82822;text-shadow:2px 2px #fff;animation:float .8s forwards}@keyframes float{to{transform:translateY(-70px);opacity:0}}.skillname{top:25%;left:50%;transform:translateX(-50%);font-size:30px;color:#fff7bd;text-shadow:0 0 6px #002b5c,3px 3px #163d72;animation:skill .8s forwards}@keyframes skill{50%{transform:translateX(-50%) scale(1.2)}to{opacity:0}}.bottom{height:180px;background:linear-gradient(#ead9ad,#c49a59);border-top:5px solid #725027;display:flex;padding:10px;gap:10px}.skills{width:48%;display:flex;gap:7px;align-items:center;justify-content:center}.sk{width:64px;height:64px;background:#26364b;border:4px solid #8c642d;border-radius:9px;display:grid;place-items:center;font-size:29px;box-shadow:inset 0 0 8px #000}.log{flex:1;background:#f7e9c6;border:3px solid #8d6838;border-radius:8px;padding:8px;overflow:auto;font-size:12px;line-height:1.45}.controls{width:135px;display:flex;flex-direction:column;gap:7px}.btn{border:2px solid #76501d;border-radius:7px;padding:10px;background:linear-gradient(#fff0a7,#d39b3b);font-weight:900;cursor:pointer}.status{position:absolute;top:105px;font-size:12px;color:#fff;background:#0008;padding:4px 8px;border-radius:10px}.left .status{left:72px}.right .status{right:72px}@media(max-width:700px){.top{height:55px}.title{font-size:18px}.turn{font-size:11px;right:6px}.hud{width:46%;top:8px}.portrait{width:42px;height:42px;font-size:25px;border-width:2px}.info{width:calc(100% - 48px)}.name{font-size:11px}.bar{height:12px;border-width:2px}.fighter.player{left:8%}.fighter.enemy{right:8%}.fighter{transform:scale(.8);transform-origin:bottom}.enemy{transform:scaleX(-1) scale(.8)}.attackP{transform:translateX(170px) scale(.8)!important}.attackE{transform:scaleX(-1) translateX(170px) scale(.8)!important}.bottom{height:205px;flex-wrap:wrap;padding:5px}.skills{width:100%;height:65px}.sk{width:49px;height:49px;font-size:22px}.log{height:110px}.controls{width:100px}.btn{padding:7px}.status{display:none}}
</style></head><body><div id="game"><div class="top"><div class="title">忍界試煉　—　戰鬥 DEMO</div><div class="turn">時間 <span id="time">00:00</span></div></div><main class="battlefield" id="field"><div class="mountains"></div><div class="ground"></div><div class="stone"></div>
<div class="hud left"><span class="portrait">⚡</span><div class="info"><div class="name">雷狐忍衣 Lv.50</div><div class="bar"><div class="hp" id="php"></div></div><div class="chakra"></div><small id="ptxt"></small></div><div class="status" id="ps">速度 2.1</div></div>
<div class="hud right"><div class="info"><div class="name">赤鬼戰衣 Lv.50</div><div class="bar"><div class="hp" id="ehp"></div></div><div class="chakra"></div><small id="etxt"></small></div><span class="portrait">🔥</span><div class="status" id="es">速度 2.5</div></div>
<div class="fighter player idle" id="p"><div class="shadow"></div><div class="head"></div><div class="hair"></div><div class="eye a"></div><div class="eye b"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg a"></div><div class="leg b"></div><div class="weapon"></div></div>
<div class="fighter enemy idle" id="e"><div class="shadow"></div><div class="head"></div><div class="hair"></div><div class="eye a"></div><div class="eye b"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg a"></div><div class="leg b"></div><div class="weapon"></div></div></main>
<div class="bottom"><div class="skills"><div class="sk">⚡</div><div class="sk">🌪️</div><div class="sk">👤</div><div class="sk">💚</div><div class="sk">🔮</div><div class="sk">💥</div></div><div class="log" id="log">雙方進入戰場，等待戰鬥開始。</div><div class="controls"><button class="btn" id="start" onclick="start()">開始戰鬥</button><button class="btn" onclick="toggleSpeed()">速度 x<span id="speed">1</span></button></div></div></div><script>
let pHP=5280,eHP=5280,max=5280,busy=false,started=false,t=0,speed=1,clock,loop;const skills=[['雷牙',1.6,'#57baff'],['旋風掌',1.15,'#70dfb2'],['幻影縛',1.05,'#b66cff'],['怪力擊',1.35,'#ffc34d']];
const $=x=>document.getElementById(x);function bars(){$('php').style.width=Math.max(0,pHP/max*100)+'%';$('ehp').style.width=Math.max(0,eHP/max*100)+'%';$('ptxt').textContent=Math.max(0,pHP)+' / '+max;$('etxt').textContent=Math.max(0,eHP)+' / '+max}
function msg(s){$('log').innerHTML=s+'<br>'+$('log').innerHTML}function fx(type,x,y,txt){let d=document.createElement('div');d.className='fx '+type;d.style.left=x+'%';d.style.top=y+'%';if(txt)d.textContent=txt;$('field').appendChild(d);setTimeout(()=>d.remove(),850)}
function strike(attacker){if(busy||pHP<=0||eHP<=0)return;busy=true;let player=attacker==='p',a=$(attacker),target=$(player?'e':'p');let useSkill=Math.random()<.62,sk=skills[Math.floor(Math.random()*skills.length)],name=useSkill?sk[0]:'普通攻擊',mult=useSkill?sk[1]:1;a.classList.remove('idle');a.classList.add(player?'attackP':'attackE');if(useSkill)fx('skillname',50,20,'【'+name+'】');setTimeout(()=>{let dodge=Math.random()<.11;if(dodge){msg((player?'赤鬼戰衣':'雷狐忍衣')+' 發動替身，閃避攻擊！');fx('skillname',50,28,'替身術！')}else{let dmg=Math.round((230+Math.random()*120)*mult);if(player)eHP-=dmg;else pHP-=dmg;target.classList.add('hurt');fx('slash',player?69:25,45);fx('damage',player?73:27,42,'-'+dmg);msg((player?'雷狐忍衣':'赤鬼戰衣')+' 發動【'+name+'】，造成 '+dmg+' 傷害');bars();setTimeout(()=>target.classList.remove('hurt'),500)}},320/speed);setTimeout(()=>{a.classList.remove(player?'attackP':'attackE');a.classList.add('idle');busy=false;if(pHP<=0||eHP<=0)finish()},800/speed)}
function tick(){if(busy)return;let chance=Math.random();strike(chance<.56?'p':'e')}function start(){if(started)return;started=true;$('start').disabled=true;msg('戰鬥開始！');clock=setInterval(()=>{t++;$('time').textContent='00:'+String(t).padStart(2,'0')},1000/speed);loop=setInterval(tick,1150/speed)}
function finish(){clearInterval(loop);clearInterval(clock);started=false;$('start').disabled=false;fx('skillname',50,30,pHP>0?'勝利！':'戰敗！');msg(pHP>0?'雷狐忍衣獲勝！':'赤鬼戰衣獲勝！')}
function toggleSpeed(){speed=speed===1?2:1;$('speed').textContent=speed;if(started){clearInterval(loop);clearInterval(clock);loop=setInterval(tick,1150/speed);clock=setInterval(()=>{t++;$('time').textContent='00:'+String(t).padStart(2,'0')},1000/speed)}}bars();
</script></body></html>
