<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>影衣忍戰 V0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eaf4ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background-image:radial-gradient(circle at 50% 0,#17375a 0,transparent 35%)}button{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #31506e;background:#091522dd;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:900;letter-spacing:2px}.gold{color:#ffc85c}.res{font-size:13px}.screen{display:none;padding:18px}.screen.on{display:block}.hero{height:360px;border:1px solid #385675;border-radius:18px;background:linear-gradient(#07111d44,#07111ddd),radial-gradient(circle at 50% 45%,#2e68a8,#101d31 48%,#07111d 72%);display:grid;place-items:center;text-align:center;overflow:hidden}.moon{font-size:90px;filter:drop-shadow(0 0 24px #79baff)}.hero h1{font-size:48px;margin:0}.hero p{opacity:.75}.btn{border:1px solid #d6a23d;background:linear-gradient(#ffd979,#c58422);color:#211506;font-weight:900;border-radius:10px;padding:12px 20px;cursor:pointer}.btn.alt{background:#10243a;color:#dcecff;border-color:#3c607e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1b2a;border:1px solid #314c66;border-radius:12px;padding:12px;cursor:pointer}.card.sel{border-color:#ffc85c;box-shadow:0 0 16px #ffbd4544}.avatar{height:115px;border-radius:10px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#203b59,#0c1725)}.name{font-weight:800;margin-top:8px}.stat{font-size:12px;opacity:.72}.skills{grid-template-columns:repeat(4,1fr)}.skill .avatar{height:75px;font-size:35px}.slots{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.slot{width:58px;height:58px;border:1px solid #4d6b85;border-radius:9px;display:grid;place-items:center;background:#0b1724;font-size:28px}.battle{position:relative;height:430px;border:1px solid #34516c;border-radius:16px;overflow:hidden;background:linear-gradient(#112d4a88,#08111ccc),radial-gradient(circle at 50% 80%,#294b43,#0a1623 65%)}.bars{display:flex;justify-content:space-between;padding:18px;gap:20px}.fighterInfo{width:45%}.bar{height:16px;background:#32151a;border-radius:9px;overflow:hidden;border:1px solid #7290a7}.hp{height:100%;background:linear-gradient(90deg,#3ac765,#91e26d);transition:.3s}.mp{height:7px;background:#2e9ee8;margin-top:4px;border-radius:5px}.arena{height:285px;position:relative}.fighter{position:absolute;bottom:35px;font-size:76px;transition:.22s;filter:drop-shadow(0 10px 8px #0008)}#p{left:20%}#e{right:20%}.hit{transform:translateY(-12px) scale(1.12)}.dmg{position:absolute;font-size:30px;font-weight:900;color:#ff665f;animation:float .7s forwards}@keyframes float{to{transform:translateY(-60px);opacity:0}}.log{height:130px;overflow:auto;background:#050b12;border:1px solid #253d52;border-radius:10px;padding:9px;font-size:12px;line-height:1.6;margin-top:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#08131fef;border-top:1px solid #31506e;display:flex;justify-content:center;z-index:6}.nav button{max-width:150px;flex:1;padding:11px 5px;background:none;border:0;color:#8fa8bc}.nav button.on{color:#ffc85c}.pad{height:64px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.tag{font-size:12px;padding:4px 8px;border:1px solid #45637c;border-radius:20px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.skills{grid-template-columns:repeat(3,1fr)}.hero{height:330px}.hero h1{font-size:38px}.battle{height:390px}.fighter{font-size:60px}#p{left:10%}#e{right:10%}.res{font-size:11px}.screen{padding:12px}.logo{font-size:19px}}
</style></head><body><div class="app"><header class="top"><div class="logo">影衣<span class="gold">忍戰</span> <small style="font-size:10px">V0.1</small></div><div class="res">🪙 12,580　💎 328　⚡ 120/120</div></header>
<section id="home" class="screen on"><div class="hero"><div><div class="moon">🌕</div><h1>影衣忍戰</h1><p>穿上外衣・配置技能・讓策略替你戰鬥</p><button class="btn" onclick="go('outfits')">開始遊戲</button></div></div><div style="margin-top:14px;display:flex;gap:10px"><button class="btn alt" onclick="go('outfits')">🥋 外套</button><button class="btn alt" onclick="go('skills')">✨ 技能</button><button class="btn alt" onclick="go('battle')">⚔️ 競技場</button></div></section>
<section id="outfits" class="screen"><div class="sectionTitle"><h2>選擇外套</h2><span class="tag">外套 = 戰鬥角色</span></div><div id="outfitGrid" class="grid"></div><div style="margin-top:18px"><button class="btn" onclick="go('skills')">下一步：配置技能</button></div></section>
<section id="skills" class="screen"><div class="sectionTitle"><h2>技能配置 <span id="count" class="gold">(0/6)</span></h2><span class="tag">最多 6 個</span></div><div id="slots" class="slots"></div><div id="skillGrid" class="grid skills"></div><div style="margin-top:18px"><button class="btn" onclick="go('battle')">進入戰鬥</button></div></section>
<section id="battle" class="screen"><div class="sectionTitle"><h2>競技場</h2><button class="btn alt" onclick="resetBattle()">重新配對</button></div><div class="battle"><div class="bars"><div class="fighterInfo"><b id="pn"></b><div class="bar"><div id="php" class="hp"></div></div><div class="mp"></div><small id="phpt"></small></div><div style="font-size:30px;font-weight:900;color:#ffc85c">VS</div><div class="fighterInfo" style="text-align:right"><b>赤鬼戰衣</b><div class="bar"><div id="ehp" class="hp"></div></div><div class="mp"></div><small id="ehpt"></small></div></div><div class="arena" id="arena"><div id="p" class="fighter">🥷</div><div id="e" class="fighter">👹</div></div></div><div style="display:flex;gap:10px;margin-top:12px"><button id="fightBtn" class="btn" onclick="startBattle()">▶ 開始自動戰鬥</button><button class="btn alt" onclick="speedToggle()">速度 x<span id="spd">1</span></button></div><div id="log" class="log">準備完成。按「開始自動戰鬥」。</div></section><div class="pad"></div></div>
<nav class="nav"><button data-s="home" class="on" onclick="go('home')">🏠<br>主城</button><button data-s="outfits" onclick="go('outfits')">🥋<br>外套</button><button data-s="skills" onclick="go('skills')">✨<br>技能</button><button data-s="battle" onclick="go('battle')">⚔️<br>戰鬥</button></nav>
<script>
const outfits=[['雷狐忍衣','⚡','速度型','HP 5280・速 2.1'],['赤鬼戰衣','🔥','爆發型','HP 5650・攻 920'],['月影之衣','🌙','幻術型','HP 4980・閃避 22%'],['翠風行者','🍃','連擊型','HP 5100・連擊 18%'],['炎龍外套','🐉','火系型','HP 5400・暴擊 24%'],['冰華之衣','❄️','控制型','HP 5200・命中 96%']];
const skills=[['雷牙','⚡',160],['火焰彈','🔥',145],['旋風掌','🌪️',125],['替身術','👤',80],['治癒掌','💚',90],['幻影縛','🔮',110],['落雷陣','🌩️',150],['怪力擊','👊',135],['冰封術','❄️',120],['影分身','👥',105],['毒霧','☠️',100],['破甲斬','🗡️',140]];
let outfit=0, chosen=[0,1,2,3,4,5], timer=null, speed=1, pHP=5280,eHP=5280,running=false;
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));if(id==='battle')resetBattle()}
function render(){document.getElementById('outfitGrid').innerHTML=outfits.map((o,i)=>`<div class="card ${i===outfit?'sel':''}" onclick="outfit=${i};render()"><div class="avatar">${o[1]}</div><div class="name">${o[0]}</div><div class="stat">${o[2]}｜${o[3]}</div></div>`).join('');document.getElementById('skillGrid').innerHTML=skills.map((s,i)=>`<div class="card skill ${chosen.includes(i)?'sel':''}" onclick="toggleSkill(${i})"><div class="avatar">${s[1]}</div><div class="name">${s[0]}</div><div class="stat">威力 ${s[2]}%</div></div>`).join('');document.getElementById('slots').innerHTML=Array.from({length:6},(_,i)=>`<div class="slot">${chosen[i]!==undefined?skills[chosen[i]][1]:'＋'}</div>`).join('');document.getElementById('count').textContent=`(${chosen.length}/6)`}
function toggleSkill(i){if(chosen.includes(i))chosen=chosen.filter(x=>x!==i);else if(chosen.length<6)chosen.push(i);render()}
function resetBattle(){clearInterval(timer);running=false;pHP=5280;eHP=5280;document.getElementById('pn').textContent=outfits[outfit][0];upd();document.getElementById('log').innerHTML='準備完成。按「開始自動戰鬥」。';document.getElementById('fightBtn').disabled=false}
function upd(){document.getElementById('php').style.width=Math.max(0,pHP/5280*100)+'%';document.getElementById('ehp').style.width=Math.max(0,eHP/5280*100)+'%';document.getElementById('phpt').textContent=Math.max(0,pHP)+' / 5280';document.getElementById('ehpt').textContent=Math.max(0,eHP)+' / 5280'}
function addLog(t){let l=document.getElementById('log');l.innerHTML=t+'<br>'+l.innerHTML}
function hit(target,d){let el=document.getElementById(target),a=document.getElementById('arena');el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),180);let x=document.createElement('div');x.className='dmg';x.textContent='-'+d;x.style.left=target==='e'?'72%':'20%';x.style.top='80px';a.appendChild(x);setTimeout(()=>x.remove(),700)}
function startBattle(){if(running)return;running=true;document.getElementById('fightBtn').disabled=true;addLog('⚔️ 戰鬥開始！');timer=setInterval(()=>{if(pHP<=0||eHP<=0){clearInterval(timer);running=false;addLog(pHP>0?'🏆 勝利！':'💀 戰敗！');document.getElementById('fightBtn').disabled=false;return}let si=chosen[Math.floor(Math.random()*chosen.length)]??0,s=skills[si],d=Math.round((80+Math.random()*70)*s[2]/100);eHP-=d;hit('e',d);addLog(`⚡ ${outfits[outfit][0]} 發動【${s[0]}】，造成 ${d} 傷害`);if(eHP>0&&Math.random()<.82){let ed=Math.round(95+Math.random()*85);pHP-=ed;setTimeout(()=>hit('p',ed),180);addLog(`🔥 赤鬼戰衣反擊，造成 ${ed} 傷害`)}upd()},900/speed)}
function speedToggle(){speed=speed===1?2:1;document.getElementById('spd').textContent=speed;if(running){clearInterval(timer);running=false;document.getElementById('fightBtn').disabled=false;addLog('速度已切換，按開始繼續。')}}
render();resetBattle();
</script></body></html>
